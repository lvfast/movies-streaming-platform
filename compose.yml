name: media-streaming-platform

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - application

services:
  postgres:
    <<: *service-security
    image: postgres:17-alpine
    # The official entrypoint starts as root so it can repair the volume owner,
    # then drops to the postgres user. Keep only the capabilities required for
    # that transition after the shared cap_drop: ALL baseline.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_streaming}
      POSTGRES_USER: ${POSTGRES_USER:-media_streaming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  redis:
    <<: *service-security
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

  backend:
    <<: *service-security
    image: ${BACKEND_IMAGE:-media-streaming-backend:local}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-media_streaming}
      DATABASE_USERNAME: ${POSTGRES_USER:-media_streaming}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  frontend:
    <<: *service-security
    image: ${FRONTEND_IMAGE:-media-streaming-frontend:local}
    networks:
      - application
      - edge
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

networks:
  application:
    internal: true
  edge:

volumes:
  postgres-data:
