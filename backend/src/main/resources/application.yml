spring:
  application:
    name: media-streaming-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/media_streaming}
    username: ${DATABASE_USERNAME:media_streaming}
    password: ${DATABASE_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 750ms
  cache:
    type: redis
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  media-base-url: ${MEDIA_BASE_URL:http://localhost:8081/media}
  auth:
    enabled: ${AUTH_ENABLED:true}
    issuer: ${JWT_ISSUER:https://stream.lvfast.site}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    private-key-location: ${JWT_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:__Host-refresh_token}
    secure-cookie: ${SECURE_COOKIE:true}
  catalog:
    manifest: ${CATALOG_MANIFEST:classpath:catalog/catalog-v3.json}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
