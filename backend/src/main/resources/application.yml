spring:
  application:
    name: media-streaming-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/media_streaming}
    username: ${DATABASE_USERNAME:media_streaming}
    password: ${DATABASE_PASSWORD:local-only-change-me}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 750ms
  cache:
    type: redis
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:media_streaming}
    password: ${RABBITMQ_PASSWORD:local-only-change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        concurrency: 1
        acknowledge-mode: manual
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  media-base-url: ${MEDIA_BASE_URL:}
  auth:
    enabled: ${AUTH_ENABLED:true}
    issuer: ${JWT_ISSUER:http://localhost:8080}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    private-key-location: ${JWT_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:__Host-refresh_token}
    secure-cookie: ${SECURE_COOKIE:true}
  catalog:
    manifest: ${CATALOG_MANIFEST:classpath:catalog/catalog-v3.json}
  media:
    storage:
      roles:
        source:
          bucket: ${MEDIA_SOURCE_BUCKET:media-source}
          endpoint: ${S3_ENDPOINT:}
          region: ${S3_REGION:auto}
          access-key: ${S3_ACCESS_KEY:}
          secret-key: ${S3_SECRET_KEY:}
        source-browser:
          bucket: ${MEDIA_SOURCE_BUCKET:media-source}
          endpoint: ${S3_BROWSER_ENDPOINT:${S3_ENDPOINT:}}
          region: ${S3_REGION:auto}
          access-key: ${S3_BROWSER_ACCESS_KEY:${S3_ACCESS_KEY:}}
          secret-key: ${S3_BROWSER_SECRET_KEY:${S3_SECRET_KEY:}}
        delivery:
          bucket: ${MEDIA_DELIVERY_BUCKET:media-delivery}
          endpoint: ${S3_ENDPOINT:}
          region: ${S3_REGION:auto}
          access-key: ${S3_ACCESS_KEY:}
          secret-key: ${S3_SECRET_KEY:}
    worker:
      credential: ${MEDIA_WORKER_CREDENTIAL:}
      lease-ttl: ${MEDIA_WORKER_LEASE_TTL:PT2M}
    signing:
      issuer: ${MEDIA_TOKEN_ISSUER:lvfast-media-backend}
      audience: ${MEDIA_TOKEN_AUDIENCE:lvfast-media}
      token-ttl: ${MEDIA_TOKEN_TTL:PT5M}
      playback-session-ttl: ${MEDIA_PLAYBACK_SESSION_TTL:PT12H}
      key-id: ${MEDIA_SIGNING_KEY_ID:}
      private-key-location: ${MEDIA_JWT_PRIVATE_KEY:${JWT_PRIVATE_KEY:file:/run/secrets/jwt-private.pem}}
      public-key-location: ${MEDIA_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:file:/run/secrets/jwt-public.pem}}
    outbox:
      poll-interval-ms: ${MEDIA_OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${MEDIA_OUTBOX_BATCH_SIZE:100}
      publish-timeout-ms: ${MEDIA_OUTBOX_PUBLISH_TIMEOUT_MS:5000}
    recovery:
      poll-interval-ms: ${MEDIA_RECOVERY_POLL_INTERVAL_MS:1000}
      initial-delay-ms: ${MEDIA_RECOVERY_INITIAL_DELAY_MS:1000}
      batch-size: ${MEDIA_RECOVERY_BATCH_SIZE:100}
    upload:
      video-max-bytes: ${MEDIA_VIDEO_MAX_BYTES:21474836480}
      artwork-max-bytes: ${MEDIA_ARTWORK_MAX_BYTES:10485760}
      part-size-bytes: ${MEDIA_PART_SIZE_BYTES:8388608}
      max-parts-per-request: 32
      session-ttl: ${MEDIA_UPLOAD_SESSION_TTL:PT24H}
      sign-ttl: ${MEDIA_SIGN_TTL:PT15M}
      sweep-batch-size: 100
      sweep-interval-ms: ${MEDIA_UPLOAD_SWEEP_INTERVAL_MS:60000}
      sweep-initial-delay-ms: ${MEDIA_UPLOAD_SWEEP_INITIAL_DELAY_MS:60000}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
