name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_load:
        description: Run the full local 20-user, 10-minute API load test
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven test suite
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend tests and contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Reject generated API client drift
        run: npm run check:api
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  configuration:
    name: Configuration and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check repository policy and local tooling
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Render local Compose configuration
        run: docker compose --env-file .env.example -f compose.yml -f compose.local.yml config --quiet
      - name: Validate Nginx configuration
        run: >-
          docker run --rm --add-host backend:127.0.0.1 -e MEDIA_ORIGIN=http://127.0.0.1:8899
          -e MEDIA_STORAGE_ORIGIN=http://127.0.0.1:19000
          -v "$PWD/frontend/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro"
          -u nginx --entrypoint sh nginx:1.28-alpine -c
          'envsubst "\${MEDIA_ORIGIN} \${MEDIA_STORAGE_ORIGIN}" < /etc/nginx/templates/nginx.conf.template > /tmp/nginx.conf && nginx -t -c /tmp/nginx.conf'
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12 -color

  acceptance:
    name: Local HTTP API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Run HTTP E2E and k6 on disposable local stack
        env:
          FULL_LOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_load }}
        run: |
          if [ "$FULL_LOAD" = "true" ]; then
            python scripts/run_acceptance.py --apply
          else
            python scripts/run_acceptance.py --apply --quick
          fi
      - name: Upload aggregate acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-acceptance-evidence
          path: artifacts/acceptance/**/*.json
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
            image: media-streaming-backend:ci
          - component: frontend
            dockerfile: frontend/Dockerfile
            image: media-streaming-frontend:ci
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
