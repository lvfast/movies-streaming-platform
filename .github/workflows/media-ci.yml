name: Admin media integration journey

# The complete P8 journey builds all workspace images and runs the nine-step Playwright acceptance
# against a disposable stack, so it is an explicit, manually dispatched integration job rather than
# part of the normal pull-request checks (ci.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-acceptance:
    name: Complete admin media journey
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install --upgrade pip requests boto3
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install media gateway dependencies
        working-directory: media-gateway
        run: npm ci
      - name: Install Playwright Chrome for Testing
        working-directory: frontend
        run: npx playwright install chrome --with-deps
      - name: Run the isolated admin media acceptance journey
        env:
          MEDIA_ACCEPTANCE_BROWSER_CHANNEL: chrome
        run: python scripts/run_media_acceptance.py --apply
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-acceptance-evidence
          path: |
            artifacts/media-acceptance/**/*.json
            artifacts/media-acceptance/**/*.log
          if-no-files-found: warn
          retention-days: 14
