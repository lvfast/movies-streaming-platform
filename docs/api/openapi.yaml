openapi: 3.1.0
info:
  title: Media Streaming Platform API
  version: 1.0.0
  description: Public demo API. Accounts and viewing data may be reset.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201': {$ref: '#/components/responses/AuthResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      operationId: refresh
      security: []
      responses:
        '200': {$ref: '#/components/responses/AuthResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        '204': {description: Logged out and refresh cookie cleared}
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Problem'}
  /catalog/home:
    get:
      operationId: catalogHome
      security: []
      responses:
        '200':
          description: Curated home rails
          content:
            application/json:
              schema:
                type: object
                required: [rails]
                properties:
                  rails:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogRail'}
  /movies/{slug}:
    get:
      operationId: movieBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MovieDetails'}
        '404': {$ref: '#/components/responses/Problem'}
  /search:
    get:
      operationId: searchMovies
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MoviePage'}
        '400': {$ref: '#/components/responses/Problem'}
  /me/watchlist:
    get:
      operationId: watchlist
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: User watchlist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MoviePage'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/watchlist/{movieId}:
    put:
      operationId: addToWatchlist
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      responses:
        '204': {description: Present in watchlist}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeFromWatchlist
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      responses:
        '204': {description: Absent from watchlist}
        '401': {$ref: '#/components/responses/Problem'}
  /movies/{movieId}/playback:
    get:
      operationId: playback
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      responses:
        '200':
          description: >-
            Managed movies answer a version-pinned grant with a short-lived media token; legacy
            fixtures keep the manifest/resume response and omit the managed fields.
          content:
            application/json:
              schema:
                anyOf:
                  - {$ref: '#/components/schemas/ManagedPlayback'}
                  - {$ref: '#/components/schemas/Playback'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/playback-sessions/{sessionId}/token:
    post:
      operationId: refreshMediaToken
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: Refreshed media token for an unexpired session of a published movie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaToken'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/playback-sessions/{sessionId}/token:
    post:
      operationId: refreshPreviewMediaToken
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: Refreshed media token for the current ADMIN preview session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaToken'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/progress/{movieId}:
    put:
      operationId: updateProgress
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgressUpdate'}
      responses:
        '200':
          description: Stored progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Progress'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/movies:
    get:
      operationId: adminListMovies
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Managed and legacy movie page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMoviePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: adminCreateMovie
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovieInput'}
      responses:
        '201':
          description: Created draft
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}:
    get:
      operationId: adminGetMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      responses:
        '200':
          description: Movie with revision
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: adminUpdateMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MovieInput'}
      responses:
        '200':
          description: Updated movie
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/genres:
    get:
      operationId: adminListGenres
      responses:
        '200':
          description: Available genres
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GenreOption'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/uploads:
    post:
      operationId: adminCreateUpload
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadInput'}
      responses:
        '201':
          description: OPEN private upload session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /admin/uploads/{uploadId}:
    get:
      operationId: adminGetUpload
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      responses:
        '200':
          description: Upload session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/uploads/{uploadId}/parts:
    get:
      operationId: adminListUploadParts
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
        - {name: marker, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Authoritative uploaded parts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadedPartPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/uploads/{uploadId}/part-urls:
    post:
      operationId: adminSignUploadParts
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartSignRequest'}
      responses:
        '200':
          description: Presigned part URLs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedPartList'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/uploads/{uploadId}/complete:
    post:
      operationId: adminCompleteUpload
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Completed session with the queued job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /admin/uploads/{uploadId}/abort:
    post:
      operationId: adminAbortUpload
      parameters:
        - {$ref: '#/components/parameters/UploadId'}
      responses:
        '200':
          description: Aborted upload session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/versions:
    get:
      operationId: adminListVersions
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Movie-scoped media versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaVersionPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/assets:
    get:
      operationId: adminListAssets
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Movie-scoped artwork assets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaAssetPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/assets/{assetId}/preview:
    post:
      operationId: adminPreviewAsset
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
      responses:
        '200':
          description: Short-lived private read URL for a validated artwork asset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetPreview'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/artwork:
    post:
      operationId: adminAttachArtwork
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtworkRequest'}
      responses:
        '200':
          description: Movie with the selected artwork pointer
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/jobs:
    get:
      operationId: adminListJobs
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Processing job page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/jobs/{jobId}:
    get:
      operationId: adminGetJob
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Processing job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobView'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/jobs/{jobId}/retry:
    post:
      operationId: adminRetryJob
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      responses:
        '201':
          description: New queued job targeting the retained source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobView'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/audit:
    get:
      operationId: adminListAudit
      parameters:
        - {name: action, in: query, schema: {type: string, maxLength: 64}}
        - {name: entityType, in: query, schema: {type: string, maxLength: 64}}
        - {name: entityId, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Paged audit history with secret-like fields removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/publish:
    post:
      operationId: adminPublishMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '200':
          description: Published movie with the active version and artwork pointers
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/activate:
    post:
      operationId: adminActivateVersion
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '200':
          description: Movie with the newly activated version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/unpublish:
    post:
      operationId: adminUnpublishMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: UNPUBLISHED movie; the active version is retained
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/archive:
    post:
      operationId: adminArchiveMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: ARCHIVED movie
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/restore:
    post:
      operationId: adminRestoreMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Restored UNPUBLISHED movie; restore never republishes
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMovie'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /admin/movies/{movieId}/preview:
    post:
      operationId: adminPreviewMovie
      parameters:
        - {$ref: '#/components/parameters/MovieId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '200':
          description: >-
            Short-lived ADMIN preview grant for the requested READY version, or for the active or
            latest READY version when no mediaVersionId is supplied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedPlayback'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    MovieId:
      name: movieId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 200}
  responses:
    AuthResponse:
      description: Access token returned; rotated refresh token is set as an HttpOnly cookie
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthTokens'}
    Problem:
      description: RFC 9457 Problem Details with stable extensions
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9_]{3,32}$'}
        password: {type: string, minLength: 12, maxLength: 128}
